<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Brave Defenders of Belly Burg</title>
<style>
:root{--bg:#fff6e6;--card:#fff;--ink:#2a2140;--acc:#12a899;--soft:#e9f7f4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1730;--card:#2a2548;--ink:#f4efff;--soft:#1f3a46}}
:root[data-theme="dark"]{--bg:#1b1730;--card:#2a2548;--ink:#f4efff;--soft:#1f3a46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:10px 12px 20px;display:flex;flex-direction:column;gap:10px}
#top{display:flex;align-items:center;gap:8px}
#dots{flex:1;display:flex;gap:5px}
#dots i{flex:1;height:8px;border-radius:8px;background:#0002}
#dots i.on{background:var(--acc)}
.ib{width:48px;height:48px;border-radius:50%;border:0;background:var(--card);font-size:22px;box-shadow:0 2px 6px #0003;color:var(--ink)}
#stage{border-radius:24px;overflow:hidden;box-shadow:0 4px 14px #0003;position:relative}
#stage svg{display:block;width:100%;height:auto}
.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.25) rotate(-6deg)}}
.biffy{cursor:pointer}
#meter{background:var(--card);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
#bar{flex:1;height:18px;border-radius:12px;background:#0002;overflow:hidden}
#fill{height:100%;width:60%;background:linear-gradient(90deg,#ff6b6b,#ffd93d,#35d6a5);transition:width .5s}
#card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 4px 14px #0002}
#txt{font-size:clamp(19px,5vw,23px);line-height:1.45;margin:0 0 8px}
#title{font-size:30px;line-height:1.1;margin:0}
#ask{font-weight:800;color:var(--acc);margin:6px 0}
#tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:8px 0}
.it{min-width:84px;min-height:84px;border-radius:20px;border:3px solid var(--acc);background:var(--soft);color:var(--ink);font:inherit;font-size:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 8px;transition:transform .15s}
.it small{font-size:14px;font-weight:700}
.it:active{transform:scale(.9)}
.it.used{opacity:.35;transform:scale(.85);pointer-events:none}
.shake{animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#msg{min-height:24px;font-weight:700;text-align:center}
#fact{background:var(--soft);border-radius:16px;padding:10px 12px;margin:8px 0;font-size:17px;display:none}
#nav{display:flex;gap:10px}
.btn{flex:1;min-height:60px;border:0;border-radius:30px;background:var(--acc);color:#fff;font:inherit;font-size:22px;font-weight:800;box-shadow:0 4px 0 #0003}
.btn:disabled{opacity:.35}
.btn.sec{flex:0 0 64px;background:var(--card);color:var(--ink)}
.conf{position:absolute;top:-30px;font-size:28px;animation:fall 3s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(340px) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="app">
<div id="top"><div id="dots"></div><button class="ib" id="lg" aria-label="Language">EN</button><button class="ib" id="dash" hidden aria-label="Stats">📊</button><button class="ib" id="snd" aria-label="Sound">🔊</button><button class="ib" id="say" aria-label="Read to me">📖</button></div>
<div id="stage"></div>
<div id="meter"><span>💪 Belly Power</span><div id="bar"><div id="fill"></div></div></div>
<div id="card"><h1 id="title" hidden></h1><p id="txt"></p><div id="ask"></div><div id="tray"></div><div id="msg"></div><div id="fact"></div>
<div id="nav"><button class="btn sec" id="back" aria-label="Back">◀</button><button class="btn" id="next"></button></div></div>
</div>

{cover:1,t:"A story about the tiny heroes inside your tummy.",sh:"LB",bg:["#ffe29a","#ffa8a8"]},
{t:"Inside every one of us is a hidden kingdom called Belly Burg. It is a bustling, busy place where millions of tiny residents live. Most of them are superheroes known as the “Good Bugs.” Meet Leo, a happy boy who has a whole world of these tiny heroes living right inside his tummy!",sh:"L",bg:["#bfe8ff","#e8ffd9"],ask:"Tap each Good Bug to wake it up!",it:[B("🫧","Bug 1"),B("🫧","Bug 2"),B("🫧","Bug 3")],gain:6,f:"Real tummies are home to trillions of tiny living things called gut bacteria. Many of them are helpers!"},
{t:"Among the Good Bugs, there is a leader named Biffy. Biffy is small, glowing, and very fast. His job is to make sure the walls of Belly Burg are strong so that Leo stays healthy, happy, and ready to play all day long. Biffy loves his job, and he loves Leo!",sh:"B",bg:["#ffb3a7","#f6d0a5"],ask:"Charge up Biffy! Tap all three.",it:[B("⚡","Speed"),B("🧱","Strong walls"),B("❤️","Love Leo")],gain:6,f:"Helpful gut bacteria help keep the lining of your tummy strong."},
{t:"Biffy doesn’t work alone. He has a team of helpers, like Zip, who help sweep away bad things and keep the “Belly Walls” sparkling clean. When the Good Bugs are strong, Leo doesn’t catch colds, and he has plenty of energy to run at the park.",sh:"BZ",bg:["#ffb3a7","#f6d0a5"],ask:"Help Zip! Tap all the Bad Bugs!",game:1,f:"Eating fruits and veggies gives your tummy fibre, which helps keep things moving."},
{t:"But sometimes, Leo visits the Land of Junk Food. He eats crunchy chips, fizzy sodas, and sticky sweets. While these taste yummy to Leo, they are like fuel for the “Bad Bugs.” This is Grumble, the leader of the Bad Bug gang. When Leo eats too much sugar, Grumble starts to grow! The more sweets Leo eats, the bigger and bossier Grumble becomes.",sh:"LG",bg:["#d9c3ff","#ffc9de"],ask:"Visit the Land of Junk Food… and watch Grumble!",it:[J("🍟","Chips"),J("🥤","Soda"),J("🍬","Sweets")],f:"Lots of sugar can help unfriendly germs grow. A small treat now and then is okay!"},
{t:"Grumble and his Bad Bug friends start to crowd out the Good Bugs. Biffy and his team feel weak and tired because sugar doesn’t give them the power they need to fight. Soon, the walls of Belly Burg start to crumble. Leo starts to feel “yucky.” His nose gets stuffy, his head feels hot, and he has a fever. He has to stay in bed while all his friends are out playing.",sh:"LBG",sick:1,pw:15,bg:["#8d99ae","#5c6b7a"],f:"When you feel yucky, tell a grown-up and rest. They can help you feel better."},
{t:"Biffy calls out, “Leo, we need the Super Foods!” Leo remembers what his doctor said. He reaches for a bowl of bright, orange papaya and sprinkles some tiny, powerful chia seeds on top. Biffy’s shield starts to shine like the sun!",sh:"LB",sick:1,bg:["#ffd29d","#ffe9c7"],ask:"Pick the Super Foods for Leo!",it:[B("🥭","Papaya"),B("🌱","Chia seeds"),X("🥤","Soda"),X("🍬","Candy")],gain:16,f:"Papaya and chia seeds have fibre, which good tummy bacteria love to munch on."},
{t:"Then, Leo eats a special dinner. There is spicy ginger, crunchy garlic, and even some bitter gourd. Grumble hates these! The “bitter” power of the gourd and the “zing” of the ginger make Grumble shrink back into the shadows.",sh:"LBG",bg:["#5b4a3a","#2f2a25"],ask:"Pick the dinner that scares Grumble!",it:[B("🫚","Ginger"),B("🧄","Garlic"),B("🥒","Bitter gourd"),X("🍩","Donut")],gain:10,f:"Ginger, garlic and bitter gourd are traditional foods many families enjoy for tummy health."},
{t:"Leo doesn’t stop there. He eats juicy chicken, strong beef, and green vegetables with a little bit of mustard. These foods provide the building blocks to repair the walls of Belly Burg. Biffy and Leo are working as a team to make the kingdom safe again.",sh:"LB",bg:["#cdeac0","#fdf0d5"],ask:"Pick the wall-repair foods!",it:[B("🍗","Chicken"),B("🥩","Beef"),B("🥬","Greens"),X("🍟","Chips")],gain:7,f:"Protein from foods like chicken, beef, eggs and beans helps your body repair itself."},

function beep(f,d=.15,ty="sine"){if(!snd)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

$("#tray").onclick=e=>{const b=e.target.closest(".it");if(!b||b.classList.contains("used")||S[i].game)return;if(S[i].quiz)return quizTap(b);const s=S[i],x=s.it[+b.dataset.k];

else{pw=Math.max(10,pw-6);miss++;bad();b.classList.add("used","shake");$("#msg").textContent="Oops! That feeds Grumble. Try another!"}

। बेली बर्ग की दीवारें गिरने लगती हैं। लियो को अच्छा नहीं लगता — नाक बंद, सिर गरम, बुखार। उसे बिस्तर में रहना पड़ता है, जबकि उसके दोस्त बाहर खेल रहे हैं।", "बिफ़ी पुकारता है, “लियो, हमें सुपर फ़ूड चाहिए!” लियो को डॉक्टर की बात याद आती है। वह नारंगी पपीते पर चिया के बीज डालकर खाता है। बिफ़ी की ढाल सूरज की तरह चमक उठती है!", "फिर लियो रात के खाने में अदरक, लहसुन और करेला खाता है। ग्रंबल को ये बिल्कुल पसंद नहीं! करेले की कड़वाहट और अदरक का तीखापन देखकर ग्रंबल अँधेरे में छिप जाता है।", "लियो यहीं नहीं रुकता। वह चिकन, बीफ़ और हरी सब्ज़ियाँ खाता है। इनसे बेली बर्ग की दीवारों की मरम्मत होती है। बिफ़ी और लियो मिलकर राज्य को फिर सुरक्षित बनाते हैं।", "अगली सुबह लियो सुपरहीरो जैसा महसूस करता है। सर्दी और बुखार गायब! बिफ़ी अंदर ख़ुशी से झूम रहा है। सेहतमंद खाना खाकर और जल्दी सोकर लियो अपने गुड बग्स को मज़बूत रखता है।", "सुपर फ़ूड क्विज़ का समय! चार सवालों के जवाब देकर लियो और बिफ़ी की मदद करो।", "अब बेली बर्ग दुनिया का सबसे सेहतमंद राज्य है! बड़ों के लिए: खाना मदद करता है, पर बच्चा बीमार हो तो डॉक्टर को ज़रूर दिखाएँ।"],te:["మీ పొట్టలో ఉండే చిన్న హీరోల కథ.", "మనందరిలో బెల్లీ బర్గ్ అనే రహస్య రాజ్యం ఉంది. అక్కడ లక్షలాది చిన్న నివాసులు ఉంటారు. వారిలో చాలామంది “గుడ్ బగ్స్” అనే సూపర్ హీరోలు. లియోను కలవండి! అతని పొట్టలో ఈ చిన్న హీరోల ప్రపంచమే ఉంది!", "గుడ్ బగ్స్ నాయకుడి పేరు బిఫీ. అతను చిన్నగా, మెరుస్తూ, చాలా వేగంగా ఉంటాడు. బెల్లీ బర్గ్ గోడలను బలంగా ఉంచడం అతని పని, అప్పుడే లియో ఆరోగ్యంగా, సంతోషంగా రోజంతా ఆడుకోగలడు. బిఫీకి తన పని, లియో ఇద్దరూ చాలా ఇష్టం!", "బిఫీ ఒంటరిగా పని చేయడు. జిప్ లాంటి సహాయకులు చెడ్డ వాటిని ఊడ్చి “బెల్లీ వాల్స్”ను మెరిపిస్తారు. గుడ్ బగ్స్ బలంగా ఉంటే లియోకు జలుబు రాదు, పార్కులో పరిగెత్తే శక్తి ఉంటుంది.", "కానీ అప్పుడప్పుడు లియో జంక్ ఫుడ్ లోకానికి వెళ్తాడు. చిప్స్, సోడా, తీపి పదార్థాలు తింటాడు. రుచిగా ఉన్నా అవి బ్యాడ్ బగ్స్‌కు ఆహారం. ఇతను గ్రంబుల్, బ్యాడ్ బగ్స్ నాయకుడు! లియో ఎంత ఎక్కువ తీపి తింటే గ్రంబుల్ అంత పెద్దగా, గర్వంగా మారతాడు.", "గ్రంబుల్, అతని స్నేహితులు గుడ్ బగ్స్‌ను తోసేస్తారు. బిఫీ బృందం అలసిపోతుంది. బెల్లీ బర్గ్ గోడలు కూలడం మొదలవుతాయి. లియోకు బాగాలేదు — ముక్కు మూసుకుపోయి, తల వేడిగా, జ్వరం. స్నేహితులు ఆడుకుంటుంటే అతను మంచంలోనే ఉండాలి.", "బిఫీ అరుస్తాడు, “లియో, మాకు సూపర్ ఫుడ్స్ కావాలి!” డాక్టర్ చెప్పింది లియోకు గుర్తొస్తుంది. నారింజ రంగు బొప్పాయిపై చియా గింజలు చల్లి తింటాడు. బిఫీ డాలు సూర్యుడిలా మెరుస్తుంది!", "తర్వాత లియో రాత్రి భోజనంలో అల్లం, వెల్లుల్లి, కాకరకాయ తింటాడు. గ్రంబుల్‌కు ఇవి అస్సలు నచ్చవు! కాకర చేదు, అల్లం ఘాటుకు గ్రంబుల్ చీకట్లోకి పారిపోతాడు.", "లియో అక్కడితో ఆగడు. చికెన్, బీఫ్, ఆకుకూరలు తింటాడు. ఇవి బెల్లీ బర్గ్ గోడలను బాగు చేస్తాయి. బిఫీ, లియో కలిసి రాజ్యాన్ని మళ్లీ సురక్షితం చేస్తారు.", "మరుసటి ఉదయం లియో సూపర్ హీరోలా లేస్తాడు. జలుబు, జ్వరం మాయం! బిఫీ లోపల సంబరపడుతున్నాడు. ఆరోగ్యకరమైన ఆహారం తిని, త్వరగా నిద్రపోవడం వల్ల లియో గుడ్ బగ్స్ బలంగా ఉంటాయి.", "సూపర్ ఫుడ్ క్విజ్ సమయం! నాలుగు ప్రశ్నలకు జవాబులిచ్చి లియో, బిఫీకి సహాయం చేయండి.", "ఇప్పుడు బెల్లీ బర్గ్ ప్రపంచంలోనే ఆరోగ్యకరమైన రాజ్యం! పెద్దలకు: ఆహారం సహాయపడుతుంది, కానీ పిల్లలు అనారోగ్యంగా ఉంటే డాక్టర్‌ను తప్పక కలవండి."]},IMG=[2,1,2,3,4,6,7,9,10,11,8,11],IMG2={4:5,6:8},LG=["en","hi","te"],LL={en:"EN",hi:"हिं",te:"తె"},LC={en:"en-IN",hi:"hi-IN",te:"te-IN"};
let lang="en",qi=0;const sid=Math.random().toString(36).slice(2,10),rec={sid,started:0,finished:0,stars:0,lang:"en",t:Date.now()};
const txt=()=>lang=="en"?S[i].t:(T[lang][i]||S[i].t);
function pic(k,key){$("#stage").innerHTML=`<img id="pic" data-i="${key}" alt="" style="display:block;width:100%;max-height:340px;object-fit:cover;object-position:top" src="data:image/jpeg;base64,${IM[k]}">`}
stage=function(){const s=S[i];$("#stage").style.background=`linear-gradient(160deg,${s.bg[0]},${s.bg[1]})`;const p=$("#pic");if(!p||p.dataset.i!=i)pic(IMG[i],i);$("#fill").style.width=pw+"%"};
$("#lg").onclick=e=>{lang=LG[(LG.indexOf(lang)+1)%3];rec.lang=lang;e.target.textContent=LL[lang];$("#txt").textContent=txt();$("#msg").textContent=""};
function game(){$("#tray").innerHTML='<div id="play" style="position:relative;width:100%;height:170px;background:var(--soft);border-radius:16px;overflow:hidden"></div>';for(let k=0;k<8;k++){const b=document.createElement("button");b.textContent="🦠";b.className="it";b.style.cssText=`position:absolute;min-width:64px;min-height:64px;padding:0;left:${Math.random()*78}%;top:${Math.random()*55}%;animation:bob ${1.5+Math.random()}s infinite`;b.onclick=()=>{b.remove();good();got++;pw=Math.min(100,pw+2);$("#fill").style.width=pw+"%";$("#msg").textContent=got<8?(8-got)+" Bad Bugs left!":"Zip cleaned it all up! ✨";if(got>=8)reveal()};$("#play").appendChild(b)}}
const Q=[["Which foods help Biffy get strong?","🥭 Papaya & chia","🍟 Chips & soda",0],["What makes Grumble grow?","🥬 Green veggies","🍬 Too much sugar",1],["Chicken and beef help repair…","🏰 Belly Burg’s walls","🧸 Leo’s toys",0],["When should Leo go to bed?","🌙 Early","🌞 Never",0]];
function showQ(){const q=Q[qi];$("#ask").textContent=`Quiz ${qi+1}/${Q.length}: ${q[0]}`;$("#tray").innerHTML=[1,2].map(n=>`<button class="it" style="flex:1;min-width:140px;font-size:22px" data-a="${n-1}">${q[n]}</button>`).join("")}
function quizTap(b){if(+b.dataset.a==Q[qi][3]){good();$("#msg").textContent="Correct! 🎉";qi++;if(qi>=Q.length){$("#tray").innerHTML="";$("#ask").textContent="Quiz done! 🌟";reveal()}else showQ()}else{bad();miss++;$("#msg").textContent="Not quite. Try the other one!"}}
const TRACK_URL="PASTE_APPS_SCRIPT_URL_HERE";
function ping(ev){try{if(!TRACK_URL.startsWith("http"))return;fetch(TRACK_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({sid,ev,lang,stars:rec.stars})})}catch(e){}}
try{if(!localStorage.getItem("bb_installed")){localStorage.setItem("bb_installed","1");ping("install")}else ping("open")}catch(e){}
async function track(){ping(rec.finished?"finish":"start");try{if(typeof claude=="undefined")return;const db=await claude.use("db");if(db)await db.collection("plays").doc(sid).set(rec)}catch(e){}}
